quarkus.application.name=english-reading-coach-api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."com.englishcoach".level=${LOG_LEVEL:INFO}

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Trace-Id

english-coach.security.jwt-issuer=${JWT_ISSUER:english-reading-coach-local}
english-coach.security.jwt-signing-key=${JWT_SIGNING_KEY:local-development-signing-key-change-before-production}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:english_reading_coach;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=false
